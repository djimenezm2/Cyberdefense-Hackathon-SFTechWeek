# Build the Rootlane `juiceshop` image (Juice Shop from our fork + telemetry) and push it
# to GHCR. The image is what Akash pulls for juiceshop.rootlane.xyz.
#
# Runs on changes to the juiceshop app, and can be run by hand (Run workflow). Uses the
# built-in GITHUB_TOKEN with packages:write — no personal token or secret needed to push.
# After the first successful run, set the package visibility to public in the GHCR UI so
# Akash can pull it without credentials.
#
# Note: we build with the runner's plain `docker build` (BuildKit is built in) instead of
# the buildx container driver, and pull base images from the AWS ECR public mirror. Both
# avoid Docker Hub's anonymous pull rate limit (429) that was failing CI.
name: juiceshop image

on:
  push:
    branches: [main]
    paths:
      - "juiceshop/**"
      - ".github/workflows/juiceshop-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rootlane-juiceshop
    steps:
      - name: Checkout (with the juice-shop submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker build -f juiceshop/Dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHA_TAG" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"
          {
            echo "Pushed:"
            echo '```'
            echo "$IMAGE:latest"
            echo "$IMAGE:$SHA_TAG"
            echo '```'
            echo "Set the GHCR package public so Akash can pull it anonymously."
          } >> "$GITHUB_STEP_SUMMARY"
